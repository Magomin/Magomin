<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-label="whoami: Matthieu Dominguez, agentic programmer">
<style>
  text { font-family: 'JetBrains Mono','IBM Plex Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
  .ui { font-size: 15px; fill: #39ff7a; } .dim { font-size: 13px; fill: #5f8d68; }
  .cur { fill: #39ff7a; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  
</style>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="3" fill="#000" fill-opacity=".45"/></pattern>
  <radialGradient id="wash1" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#39ff7a" stop-opacity=".10"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="264" fill="#000000"/><rect width="1200" height="264" fill="url(#wash1)"/>
<rect x="24" y="24" width="1152" height="216" rx="8" fill="#050805" stroke="#1f4d1f" stroke-width="1.5" filter="url(#glow)"/>
<text class="ui" x="70" y="64" xml:space="preserve"><tspan fill="#5f8d68">magomin~/dev $</tspan> whoami --full</text>
<text x="70" y="96" font-size="15" fill="#eafff1" xml:space="preserve">Matthieu Dominguez. AI enthusiast and self-taught developer. I learned to build</text>
<text x="70" y="118" font-size="15" fill="#eafff1" xml:space="preserve">software by shipping it: directing AI agents, reading what they write and holding</text>
<text x="70" y="140" font-size="15" fill="#eafff1" xml:space="preserve">the result to real engineering standards. At Cad&amp;Lan I turn the daily problems of</text>
<text x="70" y="162" font-size="15" fill="#eafff1" xml:space="preserve">a building-automation team into internal tools people actually use. Before that,</text>
<text x="70" y="184" font-size="15" fill="#eafff1" xml:space="preserve">two years in growth and product at an AI recruiting startup.</text>
<text x="70" y="206" font-size="15" fill="#5f8d68" xml:space="preserve"></text>
<text x="70" y="228" font-size="15" fill="#39ff7a" xml:space="preserve">[x] Cad&amp;Lan, Spain    [x] building since 2024    [x] self-taught, still learning</text>

<rect x="24" y="24" width="1152" height="216" rx="8" fill="url(#scan)"/>
</svg>