<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MAGOMIN, Matthieu Dominguez, agentic programmer">
<style>
  text { font-family: 'Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
  .l { font-size: 17px; fill: #e8fdff; opacity: 0; animation: reveal .01s steps(1) forwards; }
  .l.c { fill: #05d9e8; } .l.m { fill: #ff2a6d; }
  .gc { animation: glitchc 7s infinite; } .gm { animation: glitchm 7s infinite; }
  .ui { font-size: 15px; fill: #05d9e8; }
  .dim { font-size: 13px; fill: #5c6b8a; }
  .tag { font-size: 18px; fill: #f9f002; }
  .cur { fill: #f9f002; animation: blink 1s steps(1) infinite; }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes reveal { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
  @keyframes typing { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes glitchc { 0%,86%,100% { transform: translate(0,0); opacity:0; } 87% { transform: translate(-4px,1px); opacity:.9; } 89% { transform: translate(3px,-1px); opacity:.9; } 91% { transform: translate(-2px,0); opacity:.7; } 93% { transform: translate(0,0); opacity:0; } }
  @keyframes glitchm { 0%,86%,100% { transform: translate(0,0); opacity:0; } 87% { transform: translate(4px,-1px); opacity:.9; } 89% { transform: translate(-3px,1px); opacity:.9; } 91% { transform: translate(2px,0); opacity:.7; } 93% { transform: translate(0,0); opacity:0; } }
  .typed { transform-origin: 70px 0; animation: typing 2.2s steps(64) 1.6s both; }
</style>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".28"/></pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#05d9e8" stroke-opacity=".07"/></pattern>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05d9e8" stop-opacity="0"/><stop offset=".5" stop-color="#05d9e8" stop-opacity=".16"/><stop offset="1" stop-color="#05d9e8" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" fill="#07070f"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<rect x="24" y="24" width="1152" height="312" rx="8" fill="#0b0b18" stroke="#ff2a6d" stroke-opacity=".8" stroke-width="1.5" filter="url(#glow)"/>
