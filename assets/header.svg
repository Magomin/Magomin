<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="MAGOMIN, Matthieu Dominguez, agentic programmer">
<style>
  text { font-family: 'JetBrains Mono','IBM Plex Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
  .l { font-size: 26px; fill: #eafff1; opacity: 0; animation: reveal .01s steps(1) forwards; }
  .l.g { fill: #39ff7a; }
  .gl { animation: glitch 7s infinite; }
  .ui { font-size: 15px; fill: #39ff7a; }
  .dim { font-size: 13px; fill: #5f8d68; }
  .tag { font-size: 18px; fill: #39ff7a; }
  .amb { fill: #ffd24a; animation: blink 1.1s steps(1) infinite; }
  .cur { fill: #39ff7a; animation: blink 1.1s steps(1) infinite; }
  .sweep { animation: sweep 6s linear infinite; }
  .typed { transform-origin: 1130px 0; animation: typing 2.2s steps(64) 1.6s reverse both; }
  @keyframes reveal { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(430px); } }
  @keyframes typing { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes glitch { 0%,86%,100% { transform: translate(0,0); opacity:0; } 87% { transform: translate(-4px,1px); opacity:.8; } 89% { transform: translate(3px,-1px); opacity:.8; } 91% { transform: translate(-2px,0); opacity:.6; } 93% { transform: translate(0,0); opacity:0; } }
</style>
<defs>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="3" fill="#000" fill-opacity=".45"/></pattern>
  <radialGradient id="wash1" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#39ff7a" stop-opacity=".10"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="wash2" cx="0" cy="0.6" r="0.7"><stop offset="0" stop-color="#39ff7a" stop-opacity=".06"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></radialGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff7a" stop-opacity="0"/><stop offset=".5" stop-color="#39ff7a" stop-opacity=".12"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" fill="#000000"/>
<rect width="1200" height="430" fill="url(#wash1)"/><rect width="1200" height="430" fill="url(#wash2)"/>
