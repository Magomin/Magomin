<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="neofetch: identity card of Matthieu Dominguez">
<style>
  text { font-family: 'JetBrains Mono','IBM Plex Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
  .ui { font-size: 15px; fill: #39ff7a; } .dim { font-size: 13px; fill: #5f8d68; }
  .cur { fill: #39ff7a; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  
  .bob, .lf, .rf { transform-box: fill-box; transform-origin: 50% 100%; }
  .bob { animation: sway 1.6s ease-in-out infinite; }
  .lf { animation: lift 1.6s ease-in-out infinite; }
  .rf { animation: lift 1.6s ease-in-out -.8s infinite; }
  @keyframes sway { 0%,100% { transform: translateX(-4px) rotate(-2.5deg); } 50% { transform: translateX(4px) rotate(2.5deg); } }
  @keyframes lift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
</style>
